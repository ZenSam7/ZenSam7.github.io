<!doctype html>
<html lang="ru">
<head>

<title>Сколько я получу? Прототип чата-калькулятора вкладов</title>
<style>
/* ===== Цвета и темы ===== */
:root {
  --bg: #F3F5F8;
  --surface: #FCFDFE;
  --surface-2: #EDF1F6;
  --ink: #14213D;
  --soft: #46546B;
  --muted: #6B7689;

  --accent: #1F5FAE;
  --accent-ink: #F7FAFF;
  --accent-soft: #E3EBF7;
  --note-bg: #FFF5DB;
  --note-ink: #5E4500;
  --flash: rgba(31, 95, 174, .16);
  --radius-lg: 18px;
  --radius: 12px;
  --radius-sm: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1524; --surface: #152036; --surface-2: #1B2842; --ink: #EDF1F7; --soft: #B7C2D4;
    --muted: #8C99B0; --line: #27354F; --accent: #8DB3EE; --accent-ink: #0E1524; --accent-soft: #1D2F50;
    --note-bg: #2C2612; --note-ink: #F0D58A; --flash: rgba(141, 179, 238, .18); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1524; --surface: #152036; --surface-2: #1B2842; --ink: #EDF1F7; --soft: #B7C2D4;
  --muted: #8C99B0; --line: #27354F; --accent: #8DB3EE; --accent-ink: #0E1524; --accent-soft: #1D2F50;
  --note-bg: #2C2612; --note-ink: #F0D58A; --flash: rgba(141, 179, 238, .18); color-scheme: dark;
}

/* ===== Основа ===== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.num { font-variant-numeric: tabular-nums; }

.app {
  height: 100%;
  max-width: 780px;
  margin: 0 auto;
  display: flex;

/* Шапка */

}

}

.brand p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.icon-btn {

/* Плашка демо */

/* Лента сообщений */

  flex: 1; overflow-y: auto; padding: 12px 20px 24px;

}
.msg { max-width: 100%; animation: appear .32s ease-out both; }
.msg.bot { align-self: flex-start; width: 100%; }
.msg.bot > p { margin: 0; max-width: 60ch; font-size: 17px; }

@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.typing { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }

.dots i:nth-child(2) { animation-delay: .15s; }

@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

/* Композер */
.composer { padding: 8px 20px 16px; border-top: 1px solid var(--line); background: var(--bg); }

/* ===== Карточка результата ===== */

/* Переключатель способа начисления */

/* Сравнение банков */

.bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--soft); opacity: .45; transition: width .8s cubic-bezier(.2, .7, .2, 1); }

/* Блок «Расчёт выполнил калькулятор» */
.calc { background: var(--surface-2); }

.calc-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; flex: none; color: var(--accent); }
.calc-icon svg { width: 20px; height: 20px; }

.how-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.how-btn svg { width: 14px; height: 14px; transition: transform .25s; }
.how-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.how-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.how-wrap.open { grid-template-rows: 1fr; }
.how-inner { overflow: hidden; }
.how-content { padding-top: 16px; font-size: 14px; color: var(--soft); }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.formula { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin: 0 0 10px; color: var(--ink); font-size: 15px; }
.formula small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
.steps-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 12px; }
.table-scroll { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.steps-table th, .steps-table td { padding: 7px 12px; text-align: right; white-space: nowrap; }
.steps-table th:first-child, .steps-table td:first-child { text-align: left; }

.totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; color: var(--ink); font-size: 15px; margin: 10px 0; }

/* Мобильная раскладка */
@media (max-width: 560px) {
  .top, .chat, .composer { padding-left: 14px; padding-right: 14px; }

  .bank { grid-template-columns: 1fr; }

/* Уважение к prefers-reduced-motion */

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">₽</div>
      <div>
        <h1>Сколько я получу?</h1>
        <p>Прототип чата-калькулятора вкладов</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Сменить тему">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="demo-note" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
    Демонстрационные данные, не является рекомендацией
  </div>

  <main class="chat" id="chat" aria-live="polite"></main>

  <footer class="composer">
    <div class="chips" id="chips" aria-label="Подсказки"></div>
    <form class="input-row" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Например: что будет, если добавлю 2 000 ₽?" aria-label="Ваш вопрос">
      <button class="send" type="submit">Отправить</button>
    </form>
  </footer>
</div>

<script>
/* =====================================================================
   ДЕМО-ДАННЫЕ. Все ставки и условия выдуманы — меняйте их здесь.
   rate            — годовая ставка, %
   capitalization  — true: проценты каждый месяц прибавляются к сумме
                     false: проценты считаются от исходной суммы
   terms           — короткое описание условий для карточки
   ===================================================================== */
const DEMO_DATA = {
  banks: [
    {
      name: 'Банк А', nameIn: 'Банке А',
      deposit: { rate: 16.0, capitalization: true,  terms: 'Капитализация каждый месяц' },
      savings: { rate: 14.0, capitalization: true,  terms: 'Капитализация каждый месяц' },
    },
    {
      name: 'Банк Б', nameIn: 'Банке Б',
      deposit: { rate: 17.0, capitalization: false, terms: 'Проценты в конце срока' },
      savings: { rate: 15.0, capitalization: true,  terms: 'Капитализация каждый месяц' },
    },
    {
      name: 'Банк В', nameIn: 'Банке В',
      deposit: { rate: 15.5, capitalization: true,  terms: 'Капитализация каждый месяц' },
      savings: { rate: 13.5, capitalization: false, terms: 'Проценты выплачиваются на карту' },
    },
  ],
  // Кнопки-подсказки в чате
  suggestions: {
    amounts: [50000, 100000, 300000],
    terms: [3, 6, 12],
  },
  // Ограничения, которые проверяет «понимание вопроса»
  limits: { minAmount: 1000, maxAmount: 100000000, minTerm: 1, maxTerm: 36 },
};

const PRODUCTS = {
  deposit: { label: 'Вклад' },
  savings: { label: 'Накопительный счёт' },
};

/* ===================== Калькулятор (детерминированный) =====================
   Считаем помесячно: месяц = 1/12 года. Проценты за месяц = база × ставка / 12.
   method 'balance' — база = остаток в день начисления (пополнение учитывается сразу)
   method 'min'     — база = минимальный остаток за месяц (пополнение в течение
                      первого месяца не учитывается до следующего месяца)
   topupAtStart     — деньги внесены при открытии (для непополняемого вклада)      */
function calculate(cond, { amount, months, topup = 0, method = 'balance', topupAtStart = false }) {
  const monthlyRate = cond.rate / 100 / 12;
  let balance = amount + (topupAtStart ? topup : 0);
  let total = 0;
  const rows = [];
  for (let m = 1; m <= months; m++) {
    let base = balance;
    let topupHere = false;
    if (m === 1 && topup > 0 && !topupAtStart) {
      const before = balance;
      balance += topup;                         // пополнение «сегодня», внутри первого месяца
      base = method === 'min' ? before : balance;
      topupHere = true;
    }
    const interest = base * monthlyRate;
    total += interest;
    if (cond.capitalization) balance += interest; // сложные проценты
    rows.push({ m, base, interest, total, topupHere });
  }
  return { income: total, rows, monthlyRate };
}

function compare(snap) {
  return DEMO_DATA.banks.map(bank => {
    const cond = bank[snap.product];
    const opts = { amount: snap.amount, months: snap.term, method: snap.method };
    const base = calculate(cond, opts);
    const withTop = snap.topup > 0
      ? calculate(cond, { ...opts, topup: snap.topup, topupAtStart: snap.topupAtStart })
      : null;
    return { bank, cond, base, withTop, diff: withTop ? withTop.income - base.income : 0 };
  });
}
const finalIncome = r => (r.withTop || r.base).income;
function bestIndex(results) {
  let bi = 0;
  results.forEach((r, i) => { if (finalIncome(r) > finalIncome(results[bi])) bi = i; });
  return bi;
}

/* ===================== Форматирование ===================== */
const fmt0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtP = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 3 });
const rub = n => fmt0.format(Math.round(n)) + '\u00a0₽';
const rub2 = n => fmt2.format(n) + '\u00a0₽';
const pct = n => fmtP.format(n) + '%';
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}
const monthsText = n => `${n}\u00a0${plural(n, 'месяц', 'месяца', 'месяцев')}`;
const monthsAcc = n => `${n}\u00a0${plural(n, 'месяц', 'месяца', 'месяцев')}`; // «на 6 месяцев», «за 1 месяц»

/* ===================== «Понимание вопроса» =====================
   Имитация ИИ: простой разбор текста. Ничего не считает — только
   достаёт из фразы продукт, сумму, срок, пополнение и намерение.   */
function parseMessage(raw) {
  let t = ' ' + raw.toLowerCase().replace(/ё/g, 'е') + ' ';
  // «100 000» → «100000», «1 000 000» → «1000000»
  let prev;
  do { prev = t; t = t.replace(/(\d)[\s\u00a0\u202f](\d{3})(?!\d)/g, '$1$2'); } while (t !== prev);

  const r = {};
  if (/заново|сначала|сброс/.test(t)) r.reset = true;
  if (/друг(ой|ую|ое) срок|изменить срок/.test(t)) r.askTerm = true;
  if (/друг(ая|ую) сумм|изменить сумм/.test(t)) r.askAmount = true;

  if (/накопит/.test(t)) r.product = 'savings';
  else if (/вклад|депозит/.test(t)) r.product = 'deposit';

  // Срок
  const mMonths = t.match(/(\d+)\s*(мес|мc|м\.)/);
  const mYears = t.match(/(\d+)\s*(год|лет)/);
  if (mMonths) r.term = +mMonths[1];
  else if (mYears) r.term = +mYears[1] * 12;
  else if (/пол\s?года/.test(t)) r.term = 6;
  else if (/квартал/.test(t)) r.term = 3;
  else if (/\bгод\b|на год/.test(t)) r.term = 12;

  // Денежные суммы (всё, что не срок)
  const money = [];
  const re = /(\d+(?:[.,]\d+)?)\s*(тыс\S*|к(?![а-я])|млн|миллион\S*)?/g;
  let m;
  while ((m = re.exec(t))) {
    const after = t.slice(re.lastIndex).trimStart();
    if (!m[2] && /^(мес|м\.|год|лет|%)/.test(after)) continue;
    let v = parseFloat(m[1].replace(',', '.'));
    if (m[2]) v *= /млн|миллион/.test(m[2]) ? 1e6 : 1e3;
    money.push({ v, idx: m.index });
  }

  const kw = t.search(/добав|пополн|доложу|докин|довнес|внесу|внести|закину|положу ещ/);
  if (kw >= 0 && money.length) {
    const tp = money.find(x => x.idx > kw) || money[money.length - 1];
    r.topup = tp.v;
    const rest = money.filter(x => x !== tp && x.v >= 1000);
    if (rest.length) r.amount = Math.max(...rest.map(x => x.v));
  } else if (money.length) {
    r.amount = Math.max(...money.map(x => x.v));
  }

  if (/^\s*(да|ага|конечно|нужн|буду)/.test(t)) r.yes = true;
  if (/^\s*(нет|не нужн|без)/.test(t)) r.yes = false;

  if (/минимальн/.test(t)) r.method = 'min';
  else if (/на остаток|ежедневн|в день начисл/.test(t)) r.method = 'balance';

  if (r.topup == null && /сколько|получу|доход|итог|заработ/.test(t)) r.intent = 'income';
  return r;
}

/* ===================== Состояние диалога ===================== */
const state = {};
function resetState() {
  Object.assign(state, {
    product: null, amount: null, term: null, replenish: null,
    topup: 0, intent: null, method: 'balance', awaiting: null,
  });
}
resetState();

/* ===================== DOM-помощники ===================== */
const chat = document.getElementById('chat');
const chipsEl = document.getElementById('chips');
const form = document.getElementById('form');
const input = document.getElementById('input');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const RM = () => reducedMotion.matches;
const wait = ms => new Promise(res => setTimeout(res, RM() ? 0 : ms));

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function scrollDown() {
  chat.scrollTo({ top: chat.scrollHeight, behavior: RM() ? 'auto' : 'smooth' });
}

// Очередь, чтобы ответы бота шли строго по порядку
let queue = Promise.resolve();
const enqueue = fn => (queue = queue.then(fn).catch(err => console.error(err)));

function addUser(text) {
  const m = el('div', 'msg user');
  m.textContent = text;
  chat.append(m);
  scrollDown();
}

async function typeInto(node, text) {
  if (RM()) { node.textContent = text; return; }
  node.textContent = '';
  for (let i = 0; i < text.length; i += 2) {
    node.textContent = text.slice(0, i + 2);
    await new Promise(r => setTimeout(r, 14));
  }
}

// Сообщение бота: «печатает…» → текст с анимацией набора → (опционально) карточка
async function botSay(text, afterText) {
  const typing = el('div', 'msg bot typing', '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> печатает…');
  chat.append(typing);
  scrollDown();
  await wait(450 + Math.min(text.length * 6, 650));
  typing.remove();

  const m = el('div', 'msg bot');
  m.setAttribute('aria-busy', 'true');
  const p = el('p');
  m.append(p);
  chat.append(m);
  await typeInto(p, text);
  if (afterText) afterText(m, p);
  m.removeAttribute('aria-busy');
  scrollDown();
  return m;
}

function setChips(list) {
  chipsEl.innerHTML = '';
  list.forEach((c, i) => {
    const b = el('button', 'chip' + (i === 0 ? ' primary' : ''));
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', () => handleUser(c));
    chipsEl.append(b);
  });
}

/* ===================== Сценарий ===================== */
const ASK = {
  product: () => ({
    text: 'Что считаем?',
    chips: ['Вклад', 'Накопительный счёт'],
  }),
  amount: () => ({
    text: state.product === 'savings' ? 'Сколько будет на счёте?' : 'Какую сумму хотите положить?',
    chips: DEMO_DATA.suggestions.amounts.map(v => rub(v)),
  }),
  term: () => ({
    text: state.product === 'savings' ? 'За какой период посчитать?' : 'На какой срок?',
    chips: DEMO_DATA.suggestions.terms.map(n => monthsText(n)),
  }),
  replenish: () => ({
    text: 'Нужна возможность пополнять вклад?',
    chips: ['Да, буду пополнять', 'Нет, не нужно'],
  }),
  question: () => ({
    text: `Понял: ${PRODUCTS[state.product].label.toLowerCase()}, ${rub(state.amount)}, ${monthsAcc(state.term)}. Что хотите узнать?`,
    chips: ['Что будет, если добавлю 2 000 ₽?', 'Сколько получу за срок?', 'Добавлю 10 000 ₽'],
  }),
};

function ask(step, prefix) {
  state.awaiting = step;
  const q = ASK[step]();
  return enqueue(async () => {
    setChips([]);
    await botSay(prefix ? prefix + ' ' + q.text : q.text);
    setChips(q.chips);
  });
}

function next(prefix) {
  if (!state.product) return ask('product', prefix);
  if (!state.amount) return ask('amount', prefix);
  if (!state.term) return ask('term', prefix);
  if (state.product === 'deposit' && state.replenish == null) return ask('replenish', prefix);
  if (!state.intent) return ask('question', prefix);
  return answer();
}

function handleUser(text) {
  text = text.trim();
  if (!text) return;
  setChips([]);
  addUser(text);
  const p = parseMessage(text);
  const L = DEMO_DATA.limits;

  if (p.reset) { resetState(); return enqueue(() => botSay('Начнём заново.')).then(() => next()); }

  let changed = false;
  if (p.askTerm) { state.term = null; changed = true; }
  if (p.askAmount) { state.amount = null; changed = true; }

  if (p.product && (!state.product || state.awaiting === 'product')) {
    state.product = p.product;
    state.replenish = p.product === 'savings' ? true : null; // накопительный счёт всегда пополняемый
    changed = true;
  }
  if (p.amount != null) {
    if (p.amount < L.minAmount || p.amount > L.maxAmount) {
      return enqueue(() => botSay(`Сумма должна быть от ${rub(L.minAmount)} до ${rub(L.maxAmount)}. Уточните сумму.`))
        .then(() => state.awaiting && setChips(ASK[state.awaiting]().chips));
    }
    state.amount = p.amount; changed = true;
  }
  if (p.term != null) {
    if (p.term < L.minTerm || p.term > L.maxTerm) {
      return enqueue(() => botSay(`Срок должен быть от ${L.minTerm} до ${L.maxTerm} месяцев. Уточните срок.`))
        .then(() => state.awaiting && setChips(ASK[state.awaiting]().chips));
    }
    state.term = p.term; changed = true;
  }
  if (p.yes != null && state.awaiting === 'replenish') { state.replenish = p.yes; changed = true; }
  if (p.method) { state.method = p.method; changed = true; }
  if (p.topup != null && p.topup > 0) { state.topup = p.topup; state.intent = 'topup'; changed = true; }
  else if (p.intent === 'income') { state.topup = 0; state.intent = 'income'; changed = true; }

  if (!changed) {
    return enqueue(async () => {
      await botSay('Уточните сумму или срок. Например: «100 000 ₽ на 6 месяцев» или «добавлю 2 000 ₽».');
      setChips(state.awaiting ? ASK[state.awaiting]().chips : ASK.product().chips);
    });
  }
  next();
}

/* ===================== Ответ с расчётом ===================== */
function answer() {
  state.awaiting = 'question';
  const snap = {
    product: state.product, amount: state.amount, term: state.term,
    topup: state.intent === 'topup' ? state.topup : 0,
    method: state.method,
    topupAtStart: state.product === 'deposit' && state.replenish === false && state.intent === 'topup',
  };
  const ctx = { snap, tab: null };

  return enqueue(async () => {
    setChips([]);
    await botSay(sentence(ctx), (msg, p) => {
      ctx.sentenceEl = p;
      const card = buildCard(ctx);
      msg.append(card);
      render(ctx, true);
    });
    setChips(['А если добавить 5 000 ₽?', 'Сколько получу без пополнения?', 'Другой срок', 'Другая сумма', 'Начать заново']);
  });
}

// Фраза «если так, то столько»
function sentence(ctx) {
  const s = ctx.snap;
  const res = compare(s);
  const b = res[bestIndex(res)];
  if (s.topup > 0 && s.topupAtStart) {
    return `Этот вклад не пополняется, поэтому считаю, будто вы сразу внесёте больше. Если открыть вклад на ${rub(s.amount + s.topup)} вместо ${rub(s.amount)}, то за ${monthsAcc(s.term)} получите на ${rub(b.diff)} больше. Лучше всего — в ${b.bank.nameIn}.`;
  }
  if (s.topup > 0) {
    return `Если вы добавите ${rub(s.topup)} сегодня, то к концу срока получите на ${rub(b.diff)} больше. Лучше всего — в ${b.bank.nameIn}: ${rub(finalIncome(b))} дохода за ${monthsAcc(s.term)}.`;
  }
  return `Если положить ${rub(s.amount)} на ${monthsAcc(s.term)}, то больше всего получите в ${b.bank.nameIn}: ${rub(b.base.income)} дохода.`;
}

const ICON_CALC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 15.5h.01M12 15.5h.01M15.5 15.5h.01"/></svg>';
const ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function buildCard(ctx) {
  const s = ctx.snap;
  const card = el('div', 'result');
  const tags = [
    PRODUCTS[s.product].label,
    rub(s.amount),
    monthsText(s.term),
    s.topup > 0 ? `+${rub(s.topup)} ${s.topupAtStart ? 'при открытии' : 'сегодня'}` : 'без пополнений',
  ];
  card.innerHTML = `
    <div class="section">
      <div class="understood"><span>ИИ понял вопрос так:</span>${tags.map(t => `<span class="tag num">${t}</span>`).join('')}</div>
      <div class="hero"><div class="big num" data-big></div><div class="big-cap" data-cap></div></div>
    </div>
    <div class="section">
      <p class="method-title" id="mt-${uid}">Как начисляются проценты</p>
      <div class="seg" role="radiogroup" aria-labelledby="mt-${uid}">
        <button type="button" role="radio" data-method="balance">На остаток в день начисления</button>
        <button type="button" role="radio" data-method="min">На минимальный остаток за месяц</button>
      </div>
      <p class="hint" data-hint></p>
    </div>
    <div class="section"><div class="banks" data-banks></div></div>
    <div class="section calc">
      <div class="calc-head">
        <div class="calc-icon">${ICON_CALC}</div>
        <div class="calc-text"><b>Расчёт выполнил калькулятор</b><span>ИИ только понял вопрос и объяснил итог</span></div>
        <button type="button" class="how-btn" aria-expanded="false" aria-controls="how-${uid}">Как посчитано ${ICON_CHEV}</button>
      </div>
      <div class="how-wrap" id="how-${uid}"><div class="how-inner"><div class="how-content" data-how></div></div></div>
    </div>`;
  uid++;
  ctx.card = card;

  card.querySelectorAll('.seg button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (ctx.snap.method === btn.dataset.method) return;
      ctx.snap.method = btn.dataset.method;
      state.method = btn.dataset.method; // следующий ответ учтёт выбор
      render(ctx, true);
      ctx.sentenceEl.textContent = sentence(ctx);
    });
  });
  const howBtn = card.querySelector('.how-btn');
  howBtn.addEventListener('click', () => {
    const open = howBtn.getAttribute('aria-expanded') !== 'true';
    howBtn.setAttribute('aria-expanded', String(open));
    card.querySelector('.how-wrap').classList.toggle('open', open);
  });
  return card;
}
let uid = 1;

function render(ctx, animate) {
  const s = ctx.snap;
  const card = ctx.card;
  const res = compare(s);
  const bi = bestIndex(res);
  const best = res[bi];
  if (ctx.tab == null) ctx.tab = bi;

  // Итоговая цифра
  const big = card.querySelector('[data-big]');
  big.textContent = '+' + rub(s.topup > 0 ? best.diff : best.base.income);
  card.querySelector('[data-cap]').textContent = s.topup > 0
    ? `к доходу за ${monthsAcc(s.term)} в ${best.bank.nameIn}`
    : `доход за ${monthsAcc(s.term)} в ${best.bank.nameIn}`;
  if (animate && !RM()) { big.classList.remove('flash'); void big.offsetWidth; big.classList.add('flash'); }

  // Переключатель и пояснение
  card.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.method === s.method)));
  const hint = card.querySelector('[data-hint]');
  if (s.topup > 0 && !s.topupAtStart) {
    const other = compare({ ...s, method: s.method === 'min' ? 'balance' : 'min' })[bi];
    const gap = Math.abs(other.diff - best.diff);
    hint.innerHTML = s.method === 'min'
      ? `Проценты считаются от самой маленькой суммы за месяц, поэтому пополнение начнёт приносить доход только со следующего месяца. Прибавка меньше на <b class="num">${rub(gap)}</b>.`
      : `Проценты считаются от суммы на счёте в день начисления: пополнение приносит доход сразу. При начислении на минимальный остаток было бы на <b class="num">${rub(gap)}</b> меньше.`;
  } else if (s.topupAtStart) {
    hint.textContent = 'Деньги внесены при открытии, поэтому способ начисления на итог не влияет.';
  } else {
    hint.textContent = 'Без пополнений способ начисления на итог не влияет. Спросите «что будет, если добавлю 2 000 ₽?» — и разница станет видна.';
  }

  // Сравнение банков
  const max = Math.max(...res.map(finalIncome));
  const banksEl = card.querySelector('[data-banks]');
  banksEl.innerHTML = res.map((r, i) => {
    const nums = s.topup > 0
      ? `<div><span>Доход</span><b class="num">${rub(r.base.income)}</b></div>
         <div><span>С +${rub(s.topup)}</span><b class="num">${rub(r.withTop.income)}</b></div>
         <div class="diff"><span>Разница</span><b class="num">+${rub(r.diff)}</b></div>`
      : `<div><span>Доход за ${monthsAcc(s.term)}</span><b class="num">${rub(r.base.income)}</b></div>`;
    return `<div class="bank${i === bi ? ' best' : ''}">
      <div class="b-name"><b>${r.bank.name}</b>${i === bi ? '<span class="best-tag" style="display:inline">Больше всего</span>' : ''}
        <span class="num">${pct(r.cond.rate)} годовых. ${r.cond.terms}</span></div>
      <div class="b-nums">${nums}</div>
      <div class="bar" aria-hidden="true"><i data-w="${(finalIncome(r) / max * 100).toFixed(1)}"></i></div>
    </div>`;
  }).join('');
  const bars = banksEl.querySelectorAll('.bar i');
  const grow = () => bars.forEach(b => { b.style.width = b.dataset.w + '%'; });
  if (RM()) grow(); else requestAnimationFrame(() => requestAnimationFrame(grow));

  // Как посчитано
  renderHow(ctx, res);
}

function renderHow(ctx, res) {
  const s = ctx.snap;
  const r = res[ctx.tab];
  const c = r.cond;
  const scen = r.withTop || r.base;
  const mr = scen.monthlyRate;

  const tabs = res.map((x, i) =>
    `<button type="button" role="tab" aria-selected="${i === ctx.tab}" data-tab="${i}">${x.bank.name}</button>`).join('');

  const baseRule = s.method === 'min'
    ? 'минимальный остаток за месяц'
    : 'остаток в день начисления';
  const capRule = c.capitalization
    ? 'Проценты каждый месяц прибавляются к сумме (капитализация), поэтому дальше начисляются и на них.'
    : 'Проценты не прибавляются к сумме: каждый месяц они считаются от одной и той же суммы.';

  const check = c.capitalization
    ? `${rub(s.amount)} × ((1 + ${fmtP.format(mr)})<sup>${s.term}</sup> − 1) = ${rub2(r.base.income)}`
    : `${rub(s.amount)} × ${pct(c.rate)} × ${s.term}/12 = ${rub2(r.base.income)}`;

  const rows = scen.rows.map(x =>
    `<tr class="${x.topupHere ? 'topup' : ''}"><td>${x.m}${x.topupHere ? ' (пополнение)' : ''}</td><td class="num">${rub2(x.base)}</td><td class="num">${rub2(x.interest)}</td><td class="num">${rub2(x.total)}</td></tr>`).join('');

  const totals = s.topup > 0
    ? `<span>Доход без пополнения</span><span class="num">${rub2(r.base.income)}</span>
       <span>Доход с пополнением</span><span class="num">${rub2(r.withTop.income)}</span>
       <span class="strong">Разница</span><span class="num strong">+${rub2(r.diff)}</span>`
    : `<span class="strong">Доход за ${monthsAcc(s.term)}</span><span class="num strong">${rub2(r.base.income)}</span>`;

  const how = ctx.card.querySelector('[data-how]');
  how.innerHTML = `
    <div class="tabs" role="tablist" aria-label="Банк">${tabs}</div>
    <div class="formula"><small>Ставка в месяц</small><span class="num">${pct(c.rate)} ÷ 12 = ${pct(c.rate / 12)}</span></div>
    <div class="formula"><small>Проценты за месяц</small>сумма для начисления × ставка в месяц. Сумма для начисления — ${baseRule}.</div>
    <p style="margin:0 0 10px">${capRule}</p>
    <div class="table-scroll"><table class="steps-table">
      <thead><tr><th>Месяц</th><th>Сумма для начисления</th><th>Проценты</th><th>Всего процентов</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="totals">${totals}</div>
    <div class="formula"><small>Проверка по формуле, без пополнения</small><span class="num">${check}</span></div>
    <p class="fine">Для наглядности месяц считается как 1/12 года. Банки обычно считают по дням, поэтому реальный итог может немного отличаться. Ставки — демонстрационные.</p>`;
  how.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    ctx.tab = +b.dataset.tab;
    renderHow(ctx, compare(ctx.snap));
  }));
}

/* ===================== Ввод и запуск ===================== */
form.addEventListener('submit', e => {
  e.preventDefault();
  const v = input.value;
  input.value = '';
  handleUser(v);
});

// Тема: по умолчанию системная, кнопка переключает светлую/тёмную
document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.dataset.theme = current === 'dark' ? 'light' : 'dark';
});

enqueue(() => botSay('Здравствуйте! Я помогу понять, сколько вы получите, без чтения условий мелким шрифтом.'));
ask('product');
</script>
