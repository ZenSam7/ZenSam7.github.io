<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редукция календарей</title>
    <style>
        :root {
            --bg: #f4f1ea; --card: #fffcf5; --text: #333; --border: #d1c7ac;
            --accent-old: #8b4513; --accent-mod: #2e5a88;
        }
        [data-theme="dark"] {
            --bg: #1e252b; --card: #2d3a45; --text: #d1d9e1; --border: #3e4c59;
            --accent-old: #a1887f; --accent-mod: #64b5f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            transition: background 0.3s;
        }

        .header-tools {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            background: var(--card);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .container {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            max-width: 950px;
        }

        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid var(--border);
            width: 340px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center; font-size: 1.1rem; margin: 0 0 15px 0; text-transform: uppercase;
        }

        .row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 0.85rem;
        }

        select, input {
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); padding: 3px; font-size: 0.85rem;
        }

        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 10px; }

        .grid div { text-align: center; font-size: 0.8rem; padding: 5px 0; }

        .day-head { font-weight: bold; color: #888; }
        .day { cursor: pointer; border: 1px solid transparent; }
        .day:hover { border-color: var(--border); }

        .day.selected { color: white; font-weight: bold; }
        .old-style .day.selected { background: var(--accent-old) !important; }
        .modern-style .day.selected { background: var(--accent-mod) !important; }

        .day.weekend { color: #d9534f; }
        .day.empty { cursor: default; }

        .equal-sign { font-size: 2rem; font-weight: bold; color: var(--border); }

        .footer-info {
            margin-top: 10px; font-size: 0.8rem;
            border-top: 1px dashed var(--border); padding-top: 8px; text-align: center;
        }

        .am-year-badge {
            display: inline-block;
            margin-top: 5px;
            font-size: 0.78rem;
            color: var(--accent-old);
            background: rgba(139,69,19,0.08);
            border: 1px dashed var(--accent-old);
            border-radius: 4px;
            padding: 2px 8px;
        }
        [data-theme="dark"] .am-year-badge {
            color: var(--accent-old);
            background: rgba(161,136,127,0.1);
        }

        .validator { font-size: 0.75rem; color: #d9534f; margin-top: 5px; font-weight: bold; }

        .global-stats {
            margin-top: 20px; border-top: 2px solid var(--text);
            width: 100%; max-width: 700px; text-align: center; padding-top: 10px;
            font-weight: bold; font-size: 0.95rem;
        }

        @media (max-width: 720px) {
            body { padding: 4px 4px; }
            .header-tools {
                flex-wrap: wrap;
                gap: 6px 12px;
                padding: 5px 12px;
                justify-content: center;
                font-size: 0.78rem;
                margin-bottom: 6px;
            }
            .container {
                flex-direction: column;
                align-items: center;
                gap: 4px;
                width: 100%;
            }
            .card {
                width: calc(100vw - 12px);
                max-width: 440px;
                box-sizing: border-box;
                padding: 8px 10px;
            }
            .card h2 { font-size: 0.82rem; margin: 0 0 6px 0; }
            .row { margin-bottom: 4px; font-size: 0.76rem; }
            select, input { font-size: 0.76rem; padding: 2px; }
            .grid { margin-top: 5px; gap: 1px; }
            .grid div { font-size: 0.72rem; padding: 3px 0; }
            .footer-info { margin-top: 5px; padding-top: 5px; font-size: 0.72rem; }
            .equal-sign { font-size: 1rem; transform: rotate(90deg); display: block; line-height: 1; margin: 0; }
            .global-stats { max-width: 100%; font-size: 0.78rem; margin-top: 8px; padding-top: 6px; }
        }
    </style>
</head>
<body data-theme="dark">

    <div class="header-tools">
        <div>Язык: <select id="langSel" onchange="updateAll()"></select></div>
        <div>Тема:
            <select id="themeSel" onchange="document.body.setAttribute('data-theme', this.value)">
                <option value="light">Светлая</option>
                <option value="dark" selected>Тёмная</option>
            </select>
        </div>
    </div>

    <div class="container">
        <!-- ЛЕВЫЙ КАЛЕНДАРЬ — От сотворения мира (Юлианский) -->
        <div class="card old-style">
            <h2>От сотворения мира</h2>
            <div class="row">
                <span>Стиль:</span>
                <select id="oldStyle" onchange="updateAll()">
                    <option value="sept" selected>Сентябрьский</option>
                    <option value="jan">Январский</option>
                    <option value="march">Мартовский</option>
                    <option value="ultra">Ультрамартовский</option>
                    <option value="circa">Цирка-мартовский</option>
                    <option value="circaultra">Цирка-ультра-март.</option>
                </select>
            </div>
            <div class="row">
                <span>От Сотворения мира до Р.Х.:</span>
                <input type="number" id="baseOffset" value="5508" style="width:55px" oninput="updateAll()">
            </div>
            <div id="circaRow" class="row" style="display:none">
                <span>Начало (число марта):</span>
                <input type="number" id="circaDay" value="1" min="1" max="31" style="width:50px" oninput="updateAll()">
            </div>
            <div class="row">
                <select id="oldMonth" onchange="syncFromOld()"></select>
                <input type="number" id="oldYear" value="7534" style="width:70px" oninput="syncFromOld()">
            </div>
            <div class="grid" id="oldGrid"></div>
            <div class="footer-info">
                <div id="oldFullDateDesc" style="font-weight:bold;">--</div>
            </div>
        </div>

        <div class="equal-sign">=</div>

        <!-- ПРАВЫЙ КАЛЕНДАРЬ — Современный (Григорианский/Юлианский) -->
        <div class="card modern-style">
            <h2>Современный</h2>
            <div class="row">
                <span>Календарь:</span>
                <select id="modType" onchange="updateAll()">
                    <option value="gregorian" selected>Григорианский</option>
                    <option value="julian">Юлианский</option>
                </select>
            </div>
            <div class="row">
                <select id="modMonth" onchange="syncFromMod()"></select>
                <input type="number" id="modYear" value="2026" style="width:70px" oninput="syncFromMod()">
            </div>
            <div class="grid" id="modGrid"></div>

            <div class="footer-info">
                <div id="fullDateDesc" style="font-weight:bold; margin-bottom:5px;">--</div>
                <div id="easterBox">Пасха: --</div>
                <div id="validator" class="validator"></div>
            </div>
        </div>
    </div>

    <div class="global-stats" id="globalStats">
        Век: -- | Индикт: --
    </div>

    <script>
        // 1. Точный день недели для юлианского календаря (формула Зеллера)
        function julianDayOfWeek(year, month, day) {
            if (year === 6420) {
                // month: 0-11 (январь=0)
                let y = year;
                let m = month + 1;
                if (m <= 2) {
                    y -= 1;
                    m += 12;
                }
                let K = y % 100;
                let J = Math.floor(y / 100);
                let h = (day + Math.floor(13 * (m + 1) / 5) + K + Math.floor(K / 4) + 5 + J) % 7;
                // h: 0=суббота, 1=воскресенье, 2=понедельник, ..., 6=пятница
                return (h + 1) % 7; // 0=воскресенье, 1=пн, ..., 6=сб
            } else {
                // Вычисление дня недели по юлианскому календарю (0 = воскресенье)
                let a = Math.floor((14 - (month + 1)) / 12);
                let y = year + 4800 - a;
                let m = (month + 1) + 12 * a - 3;
                let jd = day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - 32083;
                return (jd + 1) % 7;
            }
        }

        // 2. Преобразование юлианской даты в григорианскую (корректное)
        function julianToGregorian(julYear, julMonth, julDay) {
            let offset = 0;
            if (julYear > 1582) {
                let centuries = Math.floor(julYear / 100);
                offset = centuries - Math.floor(centuries / 4) - 2;
            } else if (julYear === 1582 && (julMonth > 9 || (julMonth === 9 && julDay >= 15))) {
                offset = 10;
            }
            let temp = new Date(julYear, julMonth, julDay + offset);
            temp.setFullYear(julYear);
            return { year: temp.getFullYear(), month: temp.getMonth(), day: temp.getDate() };
        }

        // 3. Преобразование григорианской даты в юлианскую
        function gregorianToJulian(gregYear, gregMonth, gregDay) {
            let offset = 0;
            if (gregYear > 1582) {
                let centuries = Math.floor(gregYear / 100);
                offset = centuries - Math.floor(centuries / 4) - 2;
            } else if (gregYear === 1582 && (gregMonth > 9 || (gregMonth === 9 && gregDay >= 15))) {
                offset = 10;
            }
            let temp = new Date(gregYear, gregMonth, gregDay - offset);
            temp.setFullYear(gregYear);
            return { year: temp.getFullYear(), month: temp.getMonth(), day: temp.getDate() };
        }

        // 4. Александрийская пасхалия (возвращает месяц и день по юлианскому календарю)
        function getOrthodoxEaster(y) {
            const g = y % 19;
            const i = (19 * g + 15) % 30;
            const j = (y + Math.floor(y / 4) + i) % 7;
            const l = i - j;
            const month = 3 + Math.floor((l + 40) / 44);
            const day = l + 28 - 31 * Math.floor(month / 4);
            return { d: day, m: month - 1 };
        }

        const i18n = {
            ru: {
                months: ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],
                days: ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],
                weekLong: ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"],
                easter: "Пасха: "
            },
            old: {
                months: ["Просинец","Сечень","Сухий","Цветень","Травень","Изок","Липец","Серпень","Вересень","Листопад","Грудень","Студень"],
                days: ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],
                weekLong: ["нєдѣ́лѧ","понєдѣ́льникъ","въто́рьникъ","срѣ́да","чєтврь́тъкъ","пѧ́тъкъ","собо́та"],
                easter: "Великодень: "
            }
        };

        function makeDate(y, m, d) {
            const dt = new Date(y, m, d);
            dt.setFullYear(y);
            return dt;
        }

        let activeYearInput = null;

        function getLoc() { return i18n[document.getElementById('langSel').value || 'ru']; }

        // Функции пересчёта AM <-> юлианский год (без изменений, они верны)
        function julianToAM(y, m, d, style, offset, circaDay) {
            let amY = y + offset;
            switch (style) {
                case 'sept':       if (m >= 8) amY++; break;
                case 'jan':        break;
                case 'march':      if (m < 2) amY--; break;
                case 'ultra':      if (m >= 2) amY++; break;
                case 'circa':
                    if (m < 2) amY--;
                    else if (m === 2 && d < circaDay) amY--;
                    break;
                case 'circaultra':
                    if (m > 2) amY++;
                    else if (m === 2 && d >= circaDay) amY++;
                    break;
            }
            return amY;
        }

        function amToJulianYear(amY, m, style, offset) {
            let y = amY - offset;
            switch (style) {
                case 'sept':       if (m >= 8) y--; break;
                case 'jan':        break;
                case 'march':      if (m < 2) y++; break;
                case 'ultra':      if (m >= 2) y--; break;
                case 'circa':      if (m < 2) y++; break;
                case 'circaultra': if (m >= 2) y--; break;
            }
            return y;
        }

        // Синхронизация из левого календаря (от С.М.)
        function syncFromOld() {
            const yearVal = document.getElementById('oldYear').value;
            if (yearVal === '' || isNaN(yearVal)) return;
            const amY    = parseInt(yearVal);
            const m      = parseInt(document.getElementById('oldMonth').value);
            const style  = document.getElementById('oldStyle').value;
            const offset = parseInt(document.getElementById('baseOffset').value) || 0;
            const circaDay = parseInt(document.getElementById('circaDay').value) || 1;
            const newJulY = amToJulianYear(amY, m, style, offset);
            // Корректировка дня, если выходит за пределы месяца
            let maxDay = new Date(newJulY, m + 1, 0).getDate();
            let newDay = julianDay;
            if (newDay > maxDay) newDay = maxDay;
            julianYear = newJulY;
            julianMonth = m;
            julianDay = newDay;
            updateAll();
        }

        // Синхронизация из правого календаря (григорианский/юлианский)
        function syncFromMod() {
            const yearVal = document.getElementById('modYear').value;
            if (yearVal === '' || isNaN(yearVal)) return;
            const adY    = parseInt(yearVal);
            const m      = parseInt(document.getElementById('modMonth').value);
            const isGreg = document.getElementById('modType').value === 'gregorian';
            let newJulY, newJulM, newJulD;
            if (isGreg) {
                const jul = gregorianToJulian(adY, m, julianDay);
                newJulY = jul.year;
                newJulM = jul.month;
                newJulD = jul.day;
            } else {
                newJulY = adY;
                newJulM = m;
                newJulD = julianDay;
            }
            // коррекция дня
            let maxDay = new Date(newJulY, newJulM + 1, 0).getDate();
            if (newJulD > maxDay) newJulD = maxDay;
            julianYear = newJulY;
            julianMonth = newJulM;
            julianDay = newJulD;
            updateAll();
        }

        function updateAll() {
            const loc    = getLoc();
            const y      = julianYear;
            const m      = julianMonth;
            const d      = julianDay;
            const style  = document.getElementById('oldStyle').value;
            const offset = parseInt(document.getElementById('baseOffset').value) || 0;
            const cDay   = parseInt(document.getElementById('circaDay').value) || 1;
            const isGreg = document.getElementById('modType').value === 'gregorian';

            document.getElementById('circaRow').style.display =
                (style === 'circa' || style === 'circaultra') ? 'flex' : 'none';

            function rebuildMonthSel(id) {
                const sel = document.getElementById(id);
                const cur = parseInt(sel.value);
                sel.innerHTML = '';
                loc.months.forEach((name, i) => sel.options[i] = new Option(name, i));
                if (!isNaN(cur)) sel.value = cur;
            }
            rebuildMonthSel('oldMonth');
            rebuildMonthSel('modMonth');

            const amY = julianToAM(y, m, d, style, offset, cDay);

            // Левый календарь
            if (activeYearInput !== 'old') {
                document.getElementById('oldYear').value = amY;
            }
            document.getElementById('oldMonth').value = m;
            const oldDOW = julianDayOfWeek(y, m, d);
            document.getElementById('oldFullDateDesc').innerText =
                `${d} ${loc.months[m]} ${amY} г., ${loc.weekLong[oldDOW]}`;

            // Правый календарь: преобразование в григорианский или юлианский для отображения
            let displayYear = y, displayMonth = m, displayDay = d;
            let displayDOW = oldDOW;
            if (isGreg) {
                const greg = julianToGregorian(y, m, d);  // ИСПРАВЛЕНО: точное преобразование
                displayYear = greg.year;
                displayMonth = greg.month;
                displayDay = greg.day;
                displayDOW = new Date(displayYear, displayMonth, displayDay).getDay(); // григорианский день недели
            } else {
                displayDOW = julianDayOfWeek(y, m, d);
            }

            if (activeYearInput !== 'mod') {
                document.getElementById('modYear').value = displayYear;
            }
            document.getElementById('modMonth').value = displayMonth;
            document.getElementById('fullDateDesc').innerText =
                `${displayDay} ${loc.months[displayMonth]} ${displayYear} г., ${loc.weekLong[displayDOW]}`;

            // Рендер сеток
            renderGrid('oldGrid', y, m, d, false);
            renderGrid('modGrid', displayYear, displayMonth, displayDay, true, isGreg);

            // // Пасха — только если рассчитанная дата действительно воскресенье
            // const east = getOrthodoxEaster(y);
            // let eD = east.d, eM = east.m, eY = y;
            // if (isGreg) {
            //     const gregEast = julianToGregorian(y, east.m, east.d);
            //     eD = gregEast.day;
            //     eM = gregEast.month;
            //     eY = gregEast.year;
            // }
            // let easterYearSuffix = (eY !== displayYear) ? ` ${eY}` : '';
            // document.getElementById('easterBox').innerText = loc.easter + eD + ' ' + loc.months[eM] + easterYearSuffix;
                        // Пасха — корректировка до ближайшего воскресенья
            const east = getOrthodoxEaster(y);
            let eD = east.d, eM = east.m, eY = y;

            // Функция для создания юлианской даты (число, месяц, год)
            function getDateObj(yr, mn, dy) {
                return { year: yr, month: mn, day: dy };
            }

            // Проверяем день недели полученной даты
            let dow = julianDayOfWeek(eY, eM, eD);
            if (dow !== 0) { // не воскресенье
                // Ищем ближайшее воскресенье (вперёд и назад)
                let bestOffset = 0;
                let bestDist = 7;
                for (let offset = -3; offset <= 3; offset++) {
                    let testDate = new Date(eY, eM, eD + offset);
                    let testYear = testDate.getFullYear();
                    let testMonth = testDate.getMonth();
                    let testDay = testDate.getDate();
                    // Проверяем, что дата корректна (не выходит за пределы месяца)
                    if (testDate.getMonth() !== eM && offset !== 0) continue; // перескок месяца допустим, но проверим
                    let testDow = julianDayOfWeek(testYear, testMonth, testDay);
                    if (testDow === 0) {
                        let dist = Math.abs(offset);
                        if (dist < bestDist) {
                            bestDist = dist;
                            bestOffset = offset;
                        }
                    }
                }
                if (bestOffset !== 0) {
                    let corrected = new Date(eY, eM, eD + bestOffset);
                    eY = corrected.getFullYear();
                    eM = corrected.getMonth();
                    eD = corrected.getDate();
                }
            }

            // Преобразование в григорианский при необходимости
            if (isGreg) {
                const gregEast = julianToGregorian(eY, eM, eD);
                eD = gregEast.day;
                eM = gregEast.month;
                eY = gregEast.year;
            }
            let easterYearSuffix = (eY !== displayYear) ? ` ${eY}` : '';
            document.getElementById('easterBox').innerText = loc.easter + eD + ' ' + loc.months[eM] + easterYearSuffix;


            // Предупреждение
            document.getElementById('validator').innerText =
                (displayYear < 1582 && isGreg) ? '⚠️ Григорианский стиль ещё не введён' : '';

            // Индикт и век
            const ind  = (amY % 15 === 0) ? 15 : (amY % 15);
            const cent = displayYear > 0 ? Math.ceil(displayYear / 100) : Math.floor(displayYear / 100);
            document.getElementById('globalStats').innerText =
                `Век: ${cent} | Индикт: ${ind}`;
        }

        function renderGrid(id, y, m, selD, isMod, isGregorianMode = false) {
            const el  = document.getElementById(id);
            const loc = getLoc();
            el.innerHTML = '';

            loc.days.forEach(name => {
                const div = document.createElement('div');
                div.className = 'day-head';
                div.innerText = name;
                el.appendChild(div);
            });

            let firstDayOffset;
            if (isMod && isGregorianMode) {
                // григорианский календарь
                const firstDate = new Date(y, m, 1);
                firstDate.setFullYear(y);
                let firstDow = firstDate.getDay(); // 0 вс
                firstDayOffset = (firstDow + 6) % 7;
            } else {
                // юлианский (или левый календарь всегда юлианский)
                let firstDow = julianDayOfWeek(y, m, 1);
                firstDayOffset = (firstDow + 6) % 7;
            }

            const total = new Date(y, m + 1, 0).getDate();

            for (let i = 0; i < firstDayOffset; i++) el.appendChild(document.createElement('div'));

            for (let i = 1; i <= total; i++) {
                const div = document.createElement('div');
                div.className = 'day' + (i === selD ? ' selected' : '');
                let dow;
                if (isMod && isGregorianMode) {
                    const gDate = new Date(y, m, i);
                    gDate.setFullYear(y);
                    dow = gDate.getDay();
                } else {
                    dow = julianDayOfWeek(y, m, i);
                }
                if (dow === 0 || dow === 6) div.classList.add('weekend');
                div.innerText = i;
                div.onclick = () => {
                    if (isMod && document.getElementById('modType').value === 'gregorian') {
                        // Клик по григорианскому календарю -> переводим в юлианскую дату
                        const jul = gregorianToJulian(y, m, i);
                        julianYear = jul.year;
                        julianMonth = jul.month;
                        julianDay = jul.day;
                    } else {
                        // Юлианский режим или левый календарь
                        julianYear = y;
                        julianMonth = m;
                        julianDay = i;
                    }
                    updateAll();
                };
                el.appendChild(div);
            }
        }

        // ─── Инициализация ───
        const lSel = document.getElementById('langSel');
        Object.keys(i18n).forEach(k =>
            lSel.options.add(new Option(k==='ru'?'Русский':k==='old'?'Старославянский':'Українська', k))
        );

        const oldYearEl = document.getElementById('oldYear');
        const modYearEl = document.getElementById('modYear');

        oldYearEl.addEventListener('focus', () => { activeYearInput = 'old'; });
        oldYearEl.addEventListener('blur',  () => { activeYearInput = null; syncFromOld(); });

        modYearEl.addEventListener('focus', () => { activeYearInput = 'mod'; });
        modYearEl.addEventListener('blur',  () => { activeYearInput = null; syncFromMod(); });


        // Внутреннее представление — всегда юлианская дата, соответствующая сегодняшнему дню
        const todayGreg = new Date();
        const todayJul = gregorianToJulian(todayGreg.getFullYear(), todayGreg.getMonth(), todayGreg.getDate());
        let julianYear = todayJul.year;
        let julianMonth = todayJul.month;
        let julianDay = todayJul.day;
        updateAll();
    </script>
</body>
